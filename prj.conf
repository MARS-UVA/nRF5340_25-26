CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MODE_IMMEDIATE=y

# CONFIG_I2C=y

CONFIG_TFM_SECURE_UART=n
CONFIG_TFM_LOG_LEVEL_SILENCE=y

CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_MONITOR=y

CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=6144
CONFIG_NET_TX_STACK_SIZE=6144
CONFIG_NET_RX_STACK_SIZE=6144
CONFIG_HEAP_MEM_POOL_SIZE=32768

CONFIG_ASSERT=y
CONFIG_STACK_USAGE=y
CONFIG_THREAD_STACK_INFO=y

CONFIG_SPI=y
CONFIG_SPI_NRFX=y
CONFIG_CAN=y
CONFIG_CAN_MCP2515=y
CONFIG_SPI_INIT_PRIORITY=20

CONFIG_MULTITHREADING=y

CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y

CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_TLS_LIBRARY=y
CONFIG_MBEDTLS_MD_C=y
CONFIG_MBEDTLS_LEGACY_CRYPTO_C=y
CONFIG_MBEDTLS_SHA256_C=y
CONFIG_MBEDTLS_SHA1_C=y
CONFIG_MBEDTLS_CIPHER_C=y
CONFIG_MBEDTLS_CIPHER_MODE_CTR=y
CONFIG_MBEDTLS_HMAC_DRBG_C=y
CONFIG_MBEDTLS_CMAC_C=y
CONFIG_MBEDTLS_X509_CRT_PARSE_C=y
CONFIG_MBEDTLS_X509_USE_C=y
CONFIG_MBEDTLS_PK_C=y
CONFIG_MBEDTLS_SSL_CONTEXT_SERIALIZATION=n

# Elliptic curve crypto
CONFIG_MBEDTLS_ECP_C=y
CONFIG_MBEDTLS_ECDH_C=y
CONFIG_MBEDTLS_ECDSA_C=y

CONFIG_WIFI=y
CONFIG_NRF_WIFI_LOW_POWER=n
CONFIG_WIFI_NRF70=y
CONFIG_NRF70_STA_MODE=y

CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_L2_ETHERNET=y

CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_LOG=y
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y
# CONFIG_DNS_RESOLVER=y
# CONFIG_DNS_RESOLVER_AI_MAX_ENTRIES=10

CONFIG_NET_DHCPV4=y

CONFIG_NET_PKT_RX_COUNT=60
CONFIG_NET_PKT_TX_COUNT=3

CONFIG_POSIX_API=y
CONFIG_NET_CONTEXT_RCVTIMEO=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_SOCKETS_PACKET=y

CONFIG_DEBUG=y
CONFIG_DEBUG_OPTIMIZATIONS=n
